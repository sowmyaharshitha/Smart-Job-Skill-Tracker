<!DOCTYPE html>
<html>
<head>
    <title>Result</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>Hello {{ name }}</h1>

<h2>{{ role }}</h2>

<h3>
    Progress : {{ progress }}%
</h3>

<div class="progress-bar">
    <div class="progress-fill" style="width: {{ progress }}%;">
        {{ progress }}%
    </div>
</div>

<h3>Detected Skills</h3>

<ul>
    {% for skill in completed %}
        <li>{{ skill }}</li>
    {% endfor %}
</ul>

<h3>Missing Skills</h3>

<ul>
    {% for skill in missing %}
        <li>{{ skill }}</li>
    {% endfor %}
</ul>

<a href="/">Go Back</a>

</div>

</body>
</html>
